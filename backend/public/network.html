<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EQI Admin — Network Config</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.2rem; color: #fff; letter-spacing: 0.05em; margin-bottom: 4px; }
    .subtitle { font-size: 0.75rem; color: #555; margin-bottom: 32px; }
    .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .label { font-size: 0.72rem; color: #555; min-width: 110px; }
    .value { font-size: 0.82rem; color: #ccc; word-break: break-all; }
    .value.dim { color: #444; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
    .badge.ok { background: #1a3a1a; color: #7ee8a2; }
    .badge.evm { background: #1a1a3a; color: #7ea8e8; }
    button { padding: 9px 18px; border: none; border-radius: 6px; font-size: 0.82rem; font-family: inherit; cursor: pointer; transition: opacity 0.15s; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary   { background: #3a7bfd; color: #fff; }
    .btn-secondary { background: #2a2a2a; color: #ccc; }
    button:not(:disabled):hover { opacity: 0.85; }
    input, select { background: #111; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 0.82rem; font-family: inherit; padding: 9px 12px; width: 100%; }
    input:focus, select:focus { outline: none; border-color: #3a7bfd; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.72rem; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .form-group label .hint { color: #444; text-transform: none; font-size: 0.68rem; letter-spacing: 0; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .divider { border: none; border-top: 1px solid #1e1e1e; margin: 14px 0; }
    a { color: #3a7bfd; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .admin-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-back { padding: 9px 18px; font-size: 0.82rem; border-radius: 6px; color: #ccc; background: #2a2a2a; text-decoration: none; display: inline-block; }
    .btn-back:hover { opacity: 0.85; text-decoration: none; }

    .feedback { font-size: 0.76rem; min-height: 22px; margin-top: 8px; }
    .feedback.ok  { color: #7ee8a2; }
    .feedback.err { color: #e05555; }

    #login-screen { display: flex; justify-content: center; align-items: flex-start; padding-top: 80px; }
    .login-box { width: 100%; max-width: 380px; }
    .login-box h1 { margin-bottom: 6px; }
    .login-error { font-size: 0.76rem; color: #e05555; min-height: 20px; margin-top: 8px; }

    .net-item { margin-bottom: 4px; }
    .net-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .net-chain-id { font-size: 0.7rem; color: #555; }
    .net-detail { margin-bottom: 10px; }
    .addr { color: #7ee8a2; }
    .rpc-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .rpc-row input { max-width: 480px; }
    .rpc-fb { font-size: 0.76rem; min-height: 0; }
    .rpc-fb.ok  { color: #7ee8a2; }
    .rpc-fb.err { color: #e05555; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>EQI Admin</h1>
    <p class="subtitle">MetaNetwork MVP · operator panel</p>
    <div class="card">
      <h2>Login</h2>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
      </div>
      <button class="btn-primary" onclick="login()" id="login-btn">Login</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" hidden>

  <div class="admin-header">
    <div>
      <h1>EQI Admin — Network Config</h1>
      <p class="subtitle">operator panel · управління конфігурацією мереж</p>
    </div>
    <div class="header-actions">
      <a href="/admin" class="btn-back">← Admin</a>
      <button class="btn-secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Configured networks -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin-bottom:0">Налаштовані мережі</h2>
      <button class="btn-secondary" onclick="loadNetworks()" style="padding:6px 14px;font-size:0.75rem">Refresh</button>
    </div>
    <div id="networks-list"><p class="value dim">Loading…</p></div>
  </div>

  <!-- Add network form -->
  <div class="card">
    <h2>Додати мережу</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Network ID * <span class="hint">(1–10 символів: літери, цифри, дефіс)</span></label>
        <input type="text" id="f-id" placeholder="напр. E, SOL, BASE">
      </div>
      <div class="form-group">
        <label>Network Name *</label>
        <input type="text" id="f-name" placeholder="напр. Ethereum Holesky">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Chain Type *</label>
        <select id="f-chain-type" onchange="onChainTypeChange()">
          <option value="EVM">EVM</option>
          <option value="NON-EVM">NON-EVM</option>
        </select>
      </div>
      <div class="form-group">
        <label>Chain ID <span class="hint" id="f-chain-id-hint">(обов'язково для EVM)</span></label>
        <input type="number" id="f-chain-id" placeholder="напр. 17000">
      </div>
    </div>

    <div class="form-group">
      <label>RPC URL *</label>
      <input type="text" id="f-rpc" placeholder="https://… або wss://…">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Contract Address (tEQUI) <span class="hint" id="f-contract-hint">(EVM: 0x…40hex)</span></label>
        <input type="text" id="f-contract" placeholder="0x…">
      </div>
      <div class="form-group">
        <label>Symbol</label>
        <input type="text" id="f-symbol" value="tEQUI">
      </div>
    </div>

    <div class="form-group">
      <label>IT EOA Address *</label>
      <input type="text" id="f-it-addr" placeholder="0x… (EVM) або інший формат">
    </div>

    <div class="form-group">
      <label>IT EOA Private Key * <span class="hint">(64 hex символи, 0x необов'язково)</span></label>
      <input type="password" id="f-it-key" placeholder="••••••••••••••••••••" autocomplete="new-password">
    </div>

    <div class="form-group">
      <label>Explorer URL <span class="hint">(необов'язково)</span></label>
      <input type="text" id="f-explorer" placeholder="https://…">
    </div>

    <button class="btn-primary" onclick="addNetwork()" id="add-btn">Додати мережу</button>
    <div class="feedback" id="add-feedback"></div>
  </div>

</div>

<script>
'use strict';

let adminToken = sessionStorage.getItem('adminToken');

// ── API ───────────────────────────────────────────────────────────────────────

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (adminToken) headers['Authorization'] = 'Bearer ' + adminToken;
  try {
    const res  = await fetch(path, { ...opts, headers });
    const data = await res.json();
    return { status: res.status, data };
  } catch (e) {
    return { status: 0, data: { ok: false, reason: e.message } };
  }
}

// ── Auth ──────────────────────────────────────────────────────────────────────

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').hidden = true;
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').hidden = false;
  loadNetworks();
}

function clearToken() {
  adminToken = null;
  sessionStorage.removeItem('adminToken');
}

async function checkAuth() {
  if (!adminToken) return showLogin();
  const { status } = await api('/admin/networks');
  if (status === 401) { clearToken(); return showLogin(); }
  showDashboard();
}

async function login() {
  const pw  = document.getElementById('pw-input').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  if (!pw) return;
  btn.disabled = true;
  err.textContent = '';
  const { data } = await api('/admin/auth', { method: 'POST', body: JSON.stringify({ password: pw }) });
  btn.disabled = false;
  if (!data.ok) { err.textContent = data.reason || 'Login failed'; return; }
  adminToken = data.token;
  sessionStorage.setItem('adminToken', adminToken);
  document.getElementById('pw-input').value = '';
  showDashboard();
}

async function logout() {
  await api('/admin/logout', { method: 'POST' });
  clearToken();
  showLogin();
}

// ── Form helpers ──────────────────────────────────────────────────────────────

function onChainTypeChange() {
  const isEvm = document.getElementById('f-chain-type').value === 'EVM';
  document.getElementById('f-chain-id-hint').textContent  = isEvm ? "(обов'язково для EVM)" : "(необов'язково)";
  document.getElementById('f-contract-hint').textContent  = isEvm ? '(EVM: 0x…40hex)' : "(необов'язково)";
}

// ── Networks list ─────────────────────────────────────────────────────────────

async function loadNetworks() {
  const el = document.getElementById('networks-list');
  const { data } = await api('/admin/networks');
  if (!data.ok) {
    el.innerHTML = `<p class="value" style="color:#e05555">${data.reason || 'Error loading networks'}</p>`;
    return;
  }
  if (!data.networks.length) {
    el.innerHTML = '<p class="value dim">Немає збережених мереж.</p>';
    return;
  }
  el.innerHTML = data.networks.map(n => `
    <div class="net-item">
      <div class="net-header">
        <span class="badge ok">${esc(n.network_id)}</span>
        <span style="color:#aaa">${esc(n.network_name)}</span>
        <span class="badge evm">${esc(n.chain_type)}</span>
        ${n.chain_id != null ? `<span class="net-chain-id">chain&nbsp;${n.chain_id}</span>` : ''}
      </div>
      <div class="net-detail">
        <div class="row"><span class="label">RPC</span><span class="value">${esc(n.rpc_url)}</span></div>
        <div class="row"><span class="label">Contract</span><span class="value addr">${n.contract_address ? esc(n.contract_address) : '—'}</span></div>
        <div class="row"><span class="label">IT EOA</span><span class="value addr">${esc(n.it_eoa_address)}</span></div>
        <div class="row"><span class="label">Symbol</span><span class="value">${esc(n.symbol || '—')}</span></div>
        <div class="row"><span class="label">Explorer</span><span class="value">${n.explorer_url ? `<a href="${esc(n.explorer_url)}" target="_blank" rel="noopener">${esc(n.explorer_url)}</a>` : '—'}</span></div>
      </div>
      <div class="rpc-row">
        <input type="text" id="rpc-${esc(n.network_id)}" value="${esc(n.rpc_url)}" placeholder="нова RPC URL">
        <button class="btn-secondary" onclick="updateRpc('${esc(n.network_id)}')" style="white-space:nowrap;padding:7px 14px;font-size:0.78rem">Оновити RPC</button>
        <span class="rpc-fb" id="rpc-fb-${esc(n.network_id)}"></span>
      </div>
    </div>
    <hr class="divider">
  `).join('');
}

async function updateRpc(network_id) {
  const inp = document.getElementById(`rpc-${network_id}`);
  const fb  = document.getElementById(`rpc-fb-${network_id}`);
  fb.textContent = '';
  fb.className   = 'rpc-fb';
  const { data } = await api(`/admin/networks/${encodeURIComponent(network_id)}/rpc`, {
    method: 'PATCH',
    body:   JSON.stringify({ rpc_url: inp.value.trim() }),
  });
  if (!data.ok) {
    fb.textContent = data.reason || 'Помилка';
    fb.className   = 'rpc-fb err';
  } else {
    fb.textContent = 'Збережено';
    fb.className   = 'rpc-fb ok';
  }
}

// ── Add network ───────────────────────────────────────────────────────────────

async function addNetwork() {
  const btn = document.getElementById('add-btn');
  const fb  = document.getElementById('add-feedback');
  fb.textContent = '';
  fb.className   = 'feedback';
  btn.disabled   = true;

  const chainId = document.getElementById('f-chain-id').value.trim();
  const payload = {
    network_id:         document.getElementById('f-id').value.trim(),
    network_name:       document.getElementById('f-name').value.trim(),
    chain_type:         document.getElementById('f-chain-type').value,
    chain_id:           chainId !== '' ? parseInt(chainId, 10) : null,
    rpc_url:            document.getElementById('f-rpc').value.trim(),
    contract_address:   document.getElementById('f-contract').value.trim() || null,
    it_eoa_address:     document.getElementById('f-it-addr').value.trim(),
    it_eoa_private_key: document.getElementById('f-it-key').value.trim(),
    symbol:             document.getElementById('f-symbol').value.trim() || 'tEQUI',
    explorer_url:       document.getElementById('f-explorer').value.trim() || null,
  };

  const { data } = await api('/admin/networks', { method: 'POST', body: JSON.stringify(payload) });
  btn.disabled = false;

  if (!data.ok) {
    fb.textContent = data.errors ? data.errors.join(' | ') : (data.reason || 'Помилка');
    fb.className   = 'feedback err';
    return;
  }

  fb.textContent = `Мережу '${data.network_id}' додано.`;
  fb.className   = 'feedback ok';

  // Clear sensitive fields immediately after success
  document.getElementById('f-it-key').value = '';
  // Reset form
  ['f-id','f-name','f-chain-id','f-rpc','f-contract','f-it-addr','f-explorer'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f-symbol').value = 'tEQUI';
  document.getElementById('f-chain-type').value = 'EVM';

  loadNetworks();
}

// ── Util ──────────────────────────────────────────────────────────────────────

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────

checkAuth();
</script>
</body>
</html>
