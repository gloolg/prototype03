<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaNetwork EQI — Live Transparency</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
    }

    h1 { font-size: 1.2rem; color: #fff; letter-spacing: 0.05em; margin-bottom: 4px; }
    .subtitle { font-size: 0.75rem; color: #555; margin-bottom: 32px; }

    .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-header .subtitle { margin-bottom: 0; }
    .btn-back { padding: 9px 18px; font-size: 0.82rem; border-radius: 6px; color: #ccc; background: #2a2a2a; text-decoration: none; display: inline-block; white-space: nowrap; }
    .btn-back:hover { opacity: 0.85; }

    .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }

    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    .label { font-size: 0.72rem; color: #555; min-width: 110px; }
    .value { font-size: 0.82rem; color: #ccc; word-break: break-all; font-variant-numeric: tabular-nums; }

    /* ── Status badge (shared token set: ok / warn / err, + loading) ── */
    .status-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase; }
    .badge.ok      { background: #1a3a1a; color: #7ee8a2; }
    .badge.warn    { background: #3a2a00; color: #f5a623; }
    .badge.err     { background: #3a0a0a; color: #e05555; }
    .badge.loading { background: #1a1a1a; color: #777; }

    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot.ok      { background: #7ee8a2; box-shadow: 0 0 6px #7ee8a2; }
    .dot.warn    { background: #f5a623; box-shadow: 0 0 6px #f5a623; }
    .dot.err     { background: #e05555; box-shadow: 0 0 6px #e05555; }
    .dot.loading { background: #777; }

    .refresh-info { font-size: 0.72rem; color: #555; margin-left: auto; }

    .section-label { font-size: 0.72rem; font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase; color: #666; margin-bottom: 10px; margin-top: 28px; }
    .section-label:first-of-type { margin-top: 0; }

    /* ── Global counters ── */
    .counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .counter-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px 18px; }
    .counter-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .counter-value { font-size: 1.4rem; font-weight: bold; color: #e0e0e0; font-variant-numeric: tabular-nums; }
    .counter-value.highlight { color: #3a7bfd; }
    .counter-value.frozen    { color: #a78bfa; }
    .counter-value.danger    { color: #e05555; }

    /* ── Per-network grid ── */
    .network-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .net-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px 16px; }
    .net-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .net-id { flex-shrink: 0; font-size: 0.65rem; font-weight: bold; letter-spacing: 0.08em; color: #fff; background: #1e3a5f; padding: 2px 8px; border-radius: 4px; }
    .net-name { flex: 1; min-width: 0; font-size: 0.72rem; color: #555; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .net-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; padding: 3px 0; }
    .net-row-label { color: #666; }
    .net-row-value { font-weight: bold; color: #ccc; font-variant-numeric: tabular-nums; }
    .net-row-value.zero { color: #444; }
    .net-row-value.frozen { color: #a78bfa; }
    .net-row-value.danger { color: #e05555; }
    .net-divider { height: 1px; background: #2a2a2a; margin: 8px 0; }

    /* ── Operations table ── */
    .ops-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #2a2a2a; }
    table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
    thead th { background: #161616; color: #555; font-weight: bold; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; text-align: left; white-space: nowrap; }
    tbody tr { border-top: 1px solid #222; }
    tbody tr:nth-child(odd)  { background: #101010; }
    tbody tr:nth-child(even) { background: #131313; }
    tbody td { padding: 9px 14px; color: #999; white-space: nowrap; }

    .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: bold; letter-spacing: 0.03em; }
    .tag.GENESIS       { background: rgba(59,130,246,.18);  color: #60a5fa; }
    .tag.TREASURY      { background: rgba(139,92,246,.18);  color: #a78bfa; }
    .tag.CROSS_NETWORK { background: rgba(20,184,166,.18);  color: #2dd4bf; }
    .tag.OBSERVATION   { background: rgba(234,179,8,.18);   color: #f5a623; }
    .tag.FREEZE        { background: rgba(224,85,85,.18);   color: #e05555; }
    .tag.UNFREEZE      { background: rgba(126,232,162,.18); color: #7ee8a2; }
    .tag.STOP          { background: #3a0a0a;               color: #e05555; }
    .tag.default       { background: #1e1e1e;               color: #888; }

    .addr { font-family: 'SF Mono', monospace; font-size: 0.74rem; color: #666; }

    /* ── Error / loading / stop ── */
    .msg-box { text-align: center; padding: 40px 20px; color: #444; font-size: 0.85rem; }
    .error-box { background: #1a0808; border: 1px solid #3a1010; border-radius: 6px; padding: 12px 16px; color: #e05555; font-size: 0.78rem; margin-bottom: 16px; line-height: 1.6; }
    .stop-reason-box { background: #1a0808; border: 1px solid #3a1010; border-radius: 6px; padding: 12px 16px; color: #f5a0a0; font-size: 0.78rem; margin-bottom: 16px; line-height: 1.6; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    @media (max-width: 480px) {
      .counters { grid-template-columns: 1fr 1fr; }
      .counter-value { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>MetaNetwork EQI</h1>
    <p class="subtitle">Live Transparency Dashboard — MetaRegistry MVP</p>
  </div>
  <a href="/dapp" class="btn-back">Open DApp →</a>
</div>

<div class="status-row">
  <span class="badge loading" id="status-badge">
    <span class="dot loading" id="status-dot"></span>
    <span id="status-text">Connecting…</span>
  </span>
  <span class="refresh-info" id="refresh-info">—</span>
</div>

<div id="stop-reason-box" class="stop-reason-box" style="display:none;"></div>
<div id="error-box" class="error-box" style="display:none;"></div>

<!-- Global counters -->
<div class="section-label">Global State</div>
<div class="counters" id="counters">
  <div class="counter-card"><div class="counter-label">Total Minted</div><div class="counter-value" id="c-minted">—</div></div>
  <div class="counter-card"><div class="counter-label">A_ACTIVE (Invariant)</div><div class="counter-value highlight" id="c-active">—</div></div>
  <div class="counter-card"><div class="counter-label">Total Frozen</div><div class="counter-value frozen" id="c-frozen">—</div></div>
  <div class="counter-card"><div class="counter-label">UNAVAILABLE</div><div class="counter-value" id="c-unavail">—</div></div>
</div>

<!-- Per-network -->
<div class="section-label">Per-Network Breakdown</div>
<div class="network-grid" id="network-grid">
  <div class="msg-box">Loading…</div>
</div>

<!-- Recent operations -->
<div class="section-label">Recent Operations</div>
<div class="ops-table-wrap">
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Network</th>
        <th>Amount</th>
        <th>From</th>
        <th>To</th>
      </tr>
    </thead>
    <tbody id="ops-body">
      <tr><td colspan="6" class="msg-box">Loading…</td></tr>
    </tbody>
  </table>
</div>

<script>
  'use strict';

  // ── CONFIG ─────────────────────────────────────────────────────────────────
  // Defaults to the origin this page was loaded from — correct whenever the
  // backend serves this file itself (GET /transparency, the normal case).
  // Only set an override below if this HTML is hosted separately from the
  // backend (e.g. a static CDN pointing at a Cloud Run API on another domain).
  const API_URL_OVERRIDE = '';
  const API_URL = API_URL_OVERRIDE || window.location.origin;

  const REFRESH_INTERVAL_MS = 30_000; // 30 seconds

  let NET_NAMES = {};

  async function loadConfig() {
    if (!API_URL) return;
    try {
      const r = await fetch(`${API_URL}/registry/config`, { cache: 'no-store', headers: { 'Accept': 'application/json' } });
      const d = await r.json();
      if (d.ok) d.networks.forEach(n => { NET_NAMES[n.network_id] = n.name; });
    } catch (_) {}
  }

  const OP_LIMIT = 20;

  // ── Helpers ────────────────────────────────────────────────────────────────
  function shortAddr(addr) {
    if (!addr || addr.length < 10) return addr || '—';
    return addr.slice(0, 6) + '…' + addr.slice(-4);
  }

  function fmtNum(n) {
    if (n === undefined || n === null) return '—';
    return Number(n).toLocaleString();
  }

  function fmtTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function tagClass(event_type) {
    if (!event_type) return 'default';
    const t = event_type.toUpperCase();
    if (t.includes('GENESIS'))   return 'GENESIS';
    if (t.includes('TREASURY'))  return 'TREASURY';
    if (t.includes('CROSS') || t.includes('TRANSFER') || t.includes('ENTRY') || t.includes('EXIT')) return 'CROSS_NETWORK';
    if (t.includes('OBSERVATION')) return 'OBSERVATION';
    if (t.includes('FREEZE'))    return 'FREEZE';
    if (t.includes('UNFREEZE'))  return 'UNFREEZE';
    if (t.includes('STOP'))      return 'STOP';
    return 'default';
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderStatus(snap) {
    const gs = snap.global_state;
    const badge   = document.getElementById('status-badge');
    const dot     = document.getElementById('status-dot');
    const text    = document.getElementById('status-text');
    const errBox  = document.getElementById('error-box');
    const stopBox = document.getElementById('stop-reason-box');

    errBox.style.display = 'none';

    const sysStatus = (gs.system_status || '').toUpperCase();
    const invStatus = gs.invariant_status;

    // system_status enum is UNINITIALIZED | ACTIVE | STOP (simulator/constants.js
    // SYSTEM_STATUS) — not "STOPPED". A previous version of this check compared
    // against 'STOPPED', which never matched, so the halted-system indicator
    // never fired even when the MetaRegistry was genuinely stopped.
    if (sysStatus === 'STOP') {
      badge.className = 'badge err';
      dot.className   = 'dot err';
      text.textContent = 'STOPPED';
      if (gs.stop_reason) {
        stopBox.style.display = '';
        stopBox.textContent = 'Stop reason: ' + gs.stop_reason;
      }
    } else if (invStatus === 'violation') {
      badge.className = 'badge warn';
      dot.className   = 'dot warn';
      text.textContent = 'INVARIANT VIOLATION';
      stopBox.style.display = 'none';
    } else {
      badge.className = 'badge ok';
      dot.className   = 'dot ok';
      text.textContent = 'ACTIVE';
      stopBox.style.display = 'none';
    }
  }

  function renderCounters(snap) {
    const gs = snap.global_state;
    document.getElementById('c-minted').textContent = fmtNum(gs.TOTAL_MINTED);
    document.getElementById('c-active').textContent = fmtNum(gs.A_ACTIVE);
    document.getElementById('c-frozen').textContent = fmtNum(gs.TOTAL_FROZEN);

    const unavail = gs.UNAVAILABLE_TOTAL || 0;
    const uvEl = document.getElementById('c-unavail');
    uvEl.textContent = fmtNum(unavail);
    uvEl.className = 'counter-value' + (unavail > 0 ? ' danger' : '');
  }

  function renderNetworks(snap) {
    const grid = document.getElementById('network-grid');
    const nets = snap.per_network || {};
    const order = Object.keys(snap.per_network || {});

    let html = '';
    for (const net_id of order) {
      const n = nets[net_id];
      if (!n) continue;
      const unavailClass = (n.UNAVAILABLE || 0) > 0 ? 'danger' : 'zero';
      html += `
        <div class="net-card">
          <div class="net-header">
            <span class="net-id">Network ${net_id}</span>
            <span class="net-name">${NET_NAMES[net_id] || n.network_name || ''}</span>
          </div>
          <div class="net-row"><span class="net-row-label">Wallet Active</span><span class="net-row-value">${fmtNum(n.wallet_active_total)}</span></div>
          <div class="net-row"><span class="net-row-label">IT Active</span><span class="net-row-value">${fmtNum(n.IT_ACTIVE)}</span></div>
          <div class="net-divider"></div>
          <div class="net-row"><span class="net-row-label">IT Frozen</span><span class="net-row-value frozen">${fmtNum(n.IT_FROZEN)}</span></div>
          <div class="net-row"><span class="net-row-label">UNAVAILABLE</span><span class="net-row-value ${unavailClass}">${fmtNum(n.UNAVAILABLE)}</span></div>
          <div class="net-divider"></div>
          <div class="net-row"><span class="net-row-label">Network Total</span><span class="net-row-value">${fmtNum(n.network_total)}</span></div>
        </div>`;
    }
    grid.innerHTML = html || '<div class="msg-box">No network data.</div>';
  }

  function renderOps(snap) {
    const ops  = (snap.latest_operations || []).slice().reverse().slice(0, OP_LIMIT);
    const tbody = document.getElementById('ops-body');

    if (!ops.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="msg-box">No operations yet.</td></tr>';
      return;
    }

    tbody.innerHTML = ops.map(op => {
      const tc = tagClass(op.event_type);
      const t  = op.created_at
        ? (op.created_at > 1e12 ? fmtTime(op.created_at) : fmtTime(op.created_at * 1000))
        : '—';
      return `<tr>
        <td>${t}</td>
        <td><span class="tag ${tc}">${op.event_type || '—'}</span></td>
        <td>${op.network_id || '—'}</td>
        <td>${op.amount !== undefined && op.amount !== null ? fmtNum(op.amount) + ' tEQUI' : '—'}</td>
        <td class="addr">${shortAddr(op.from_address)}</td>
        <td class="addr">${shortAddr(op.to_address)}</td>
      </tr>`;
    }).join('');
  }

  // ── Fetch & refresh ────────────────────────────────────────────────────────
  let lastUpdated = null;
  let countdown   = REFRESH_INTERVAL_MS / 1000;
  let timer       = null;

  async function fetchAndRender() {
    clearInterval(timer);
    const errBox = document.getElementById('error-box');
    const info   = document.getElementById('refresh-info');
    info.textContent = 'Refreshing…';

    try {
      if (!API_URL) {
        errBox.style.display = '';
        errBox.textContent   = 'API_URL not configured. Set API_URL_OVERRIDE in the script.';
        return;
      }

      // Explicit Accept header: the backend serves this same dashboard page for
      // GET /transparency when the client prefers text/html (plain browser
      // navigation), and the JSON snapshot otherwise. fetch() defaults to
      // Accept: */*, which still resolves to JSON here, but this stays correct
      // even if that negotiation default is ever tightened server-side.
      const r = await fetch(`${API_URL}/transparency?limit=${OP_LIMIT}`, {
        cache: 'no-store',
        headers: { 'Accept': 'application/json' },
      });
      if (!r.ok) {
        const body = await r.text().catch(() => '');
        throw new Error(`HTTP ${r.status}: ${body.slice(0, 100)}`);
      }

      const json = await r.json();
      if (!json.ok || !json.snapshot) throw new Error('Backend returned ok=false');

      errBox.style.display = 'none';
      const snap = json.snapshot;
      renderStatus(snap);
      renderCounters(snap);
      renderNetworks(snap);
      renderOps(snap);

      lastUpdated = new Date();
    } catch (err) {
      errBox.style.display = '';
      errBox.textContent   = 'Could not fetch data: ' + err.message;
      console.error('[transparency]', err);
    } finally {
      countdown = REFRESH_INTERVAL_MS / 1000;
      scheduleCountdown();
    }
  }

  function scheduleCountdown() {
    const info = document.getElementById('refresh-info');
    timer = setInterval(() => {
      countdown--;
      const ts = lastUpdated ? lastUpdated.toLocaleTimeString() : '—';
      if (countdown <= 0) {
        clearInterval(timer);
        fetchAndRender();
      } else {
        info.textContent = `Last updated ${ts} · Refresh in ${countdown}s`;
      }
    }, 1000);
    // initial display
    const ts = lastUpdated ? lastUpdated.toLocaleTimeString() : '—';
    info.textContent = `Last updated ${ts} · Refresh in ${countdown}s`;
  }

  // Kick off
  loadConfig().then(() => fetchAndRender());
</script>
</body>
</html>
